<svg xmlns="http://www.w3.org/2000/svg" width="464" height="270" viewBox="108 26 464 270" role="img" aria-label="CrushGrid — Distributed Multi-Node Compression and Archival">
  <defs>
    <style>
      .ink-heavy { fill: none; stroke: #132035; stroke-width: 2.05; stroke-linecap: round; stroke-linejoin: round; }
      .ink-med   { fill: none; stroke: #132035; stroke-width: 1.32; stroke-linecap: round; stroke-linejoin: round; }
      .ink-fine  { fill: none; stroke: #334763; stroke-width: 0.9; stroke-linecap: round; stroke-linejoin: round; }
      .ink-hair  { fill: none; stroke: #64748B; stroke-width: 0.65; stroke-linecap: round; stroke-linejoin: round; }
      .ink-fill  { fill: #132035; stroke: none; }
      .ink-mid-fill { fill: #334763; stroke: none; }
      .ink-shade { fill: #132035; fill-opacity: 0.07; stroke: none; }
      .ink-shade-hi { fill: #132035; fill-opacity: 0.14; stroke: none; }
      .accent-heavy { fill: none; stroke: #0284C7; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .accent-line  { fill: none; stroke: #0284C7; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
      .accent-fill  { fill: #0284C7; stroke: none; }
    
      @keyframes cgFlow {
        0% { stroke-dashoffset: 48; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes cgPulse {
        0%, 100% { opacity: 0.70; }
        50% { opacity: 1; }
      }
      @keyframes cgCompress {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.975); }
      }
      .accent-line, .accent-heavy { stroke-dasharray: 20 6; animation: cgFlow 3.6s linear infinite, cgPulse 3.2s ease-in-out infinite; }
      .accent-fill { animation: cgPulse 2.8s ease-in-out infinite; }
      #grid-ring { animation: cgPulse 4.6s ease-in-out infinite; }
      #crumpled-paper { transform-box: fill-box; transform-origin: center; animation: cgCompress 4.2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .accent-line, .accent-heavy, .accent-fill, #grid-ring, #crumpled-paper { animation: none; stroke-dasharray: none; }
      }
    
    </style>
  </defs>

  <!-- ============ LAYER 0: CLEAN DISTRIBUTED GRID ORBITAL RING ============ -->
  <g id="grid-ring">
    <circle cx="340.0" cy="158.0" r="102" class="ink-hair" opacity="0.55"/>
    <circle cx="340.0" cy="158.0" r="94" class="ink-hair" stroke-dasharray="2.2 4.6" opacity="0.38"/>
    <g class="ink-hair" opacity="0.45">
      <line x1="442.0" y1="158.0" x2="447.0" y2="158.0"/>
      <line x1="438.5" y1="184.4" x2="441.2" y2="185.1"/>
      <line x1="391.0" y1="246.3" x2="392.4" y2="248.8"/>
