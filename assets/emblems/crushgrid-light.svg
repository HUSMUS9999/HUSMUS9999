    <!-- Central high-density BLAKE3 seal diamond -->
    <path class="accent-fill" d="M 340,154.5 L 345.5,160 L 340,165.5 L 334.5,160 Z"/>
  </g>

  <!-- ============ LAYER 3: HERALDIC BASE VIGNETTE ============ -->
