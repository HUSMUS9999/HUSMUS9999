      <line x1="310" y1="196" x2="323" y2="175"/>
      <line x1="336" y1="196" x2="323" y2="175"/>
      <line x1="336" y1="196" x2="354" y2="176"/>
      <line x1="364" y1="196" x2="354" y2="176"/>
      <line x1="324" y1="145" x2="356" y2="143"/>
      <line x1="356" y1="143" x2="354" y2="176"/>
      <line x1="354" y1="176" x2="323" y2="175"/>
      <line x1="323" y1="175" x2="324" y2="145"/>
    </g>
