      <line x1="241.5" y1="131.6" x2="238.8" y2="130.9"/>
      <line x1="289.0" y1="69.7" x2="287.6" y2="67.2"/>
      <line x1="313.6" y1="59.5" x2="312.9" y2="56.8"/>
      <line x1="340.0" y1="56.0" x2="340.0" y2="51.0"/>
      <line x1="366.4" y1="59.5" x2="367.1" y2="56.8"/>
      <line x1="391.0" y1="69.7" x2="392.4" y2="67.2"/>
      <line x1="438.5" y1="131.6" x2="441.2" y2="130.9"/>
    </g>
    
    <line x1="265.9" y1="100.1" x2="277.0" y2="108.7" class="ink-hair" stroke-dasharray="2.5 2.5" opacity="0.75"/>
    <path class="ink-shade" d="M 259.6,88.7 L 266.1,95.2 L 259.6,101.7 L 253.1,95.2 Z"/>
    <path class="ink-med" d="M 259.6,88.7 L 266.1,95.2 L 259.6,101.7 L 253.1,95.2 Z"/>
    <circle cx="259.6" cy="95.2" r="2.0" class="accent-fill"/>

    <line x1="414.1" y1="100.1" x2="403.0" y2="108.7" class="ink-hair" stroke-dasharray="2.5 2.5" opacity="0.75"/>
    <path class="ink-shade" d="M 420.4,88.7 L 426.9,95.2 L 420.4,101.7 L 413.9,95.2 Z"/>
    <path class="ink-med" d="M 420.4,88.7 L 426.9,95.2 L 420.4,101.7 L 413.9,95.2 Z"/>
    <circle cx="420.4" cy="95.2" r="2.0" class="accent-fill"/>

    <line x1="414.1" y1="215.9" x2="403.0" y2="207.3" class="ink-hair" stroke-dasharray="2.5 2.5" opacity="0.75"/>
    <path class="ink-shade" d="M 420.4,214.3 L 426.9,220.8 L 420.4,227.3 L 413.9,220.8 Z"/>
    <path class="ink-med" d="M 420.4,214.3 L 426.9,220.8 L 420.4,227.3 L 413.9,220.8 Z"/>
    <circle cx="420.4" cy="220.8" r="2.0" class="accent-fill"/>

    <line x1="265.9" y1="215.9" x2="277.0" y2="207.3" class="ink-hair" stroke-dasharray="2.5 2.5" opacity="0.75"/>
    <path class="ink-shade" d="M 259.6,214.3 L 266.1,220.8 L 259.6,227.3 L 253.1,220.8 Z"/>
    <path class="ink-med" d="M 259.6,214.3 L 266.1,220.8 L 259.6,227.3 L 253.1,220.8 Z"/>
    <circle cx="259.6" cy="220.8" r="2.0" class="accent-fill"/>
    <!-- Minimal editorial glints (restraint!) -->
    <path class="accent-fill" d="M 204.00,153.20 L 205.10,156.90 L 208.80,158.00 L 205.10,159.10 L 204.00,162.80 L 202.90,159.10 L 199.20,158.00 L 202.90,156.90 Z" opacity="0.88"/>
    <path class="accent-fill" d="M 476.00,153.20 L 477.10,156.90 L 480.80,158.00 L 477.10,159.10 L 476.00,162.80 L 474.90,159.10 L 471.20,158.00 L 474.90,156.90 Z" opacity="0.88"/>
    <circle cx="340.0" cy="41" r="1.6" class="accent-fill" opacity="0.85"/>
  </g>

  <!-- ============ LAYER 1: SLEEK ARCHITECTURAL COMPRESSION PRESS ============ -->
  <g id="compression-press">
    <!-- Slender continuous vertical guide rods -->
    <line x1="278" y1="88" x2="278" y2="228" class="ink-med"/>
    <line x1="282" y1="88" x2="282" y2="228" class="ink-hair" opacity="0.65"/>
    <line x1="402" y1="88" x2="402" y2="228" class="ink-med"/>
    <line x1="398" y1="88" x2="398" y2="228" class="ink-hair" opacity="0.65"/>

    <!-- Top handle & threaded compression screw -->
    <path class="ink-shade" d="M 308,56 L 372,56 L 376,60 L 372,63 L 308,63 L 304,60 Z"/>
    <path class="ink-heavy" d="M 308,56 L 372,56 L 376,60 L 372,63 L 308,63 L 304,60 Z"/>
    <circle cx="340" cy="59.5" r="1.9" class="accent-fill"/>
    <path class="ink-med" d="M 335,63 L 345,63 L 345,78 L 335,78 Z"/>
    <path class="ink-med" d="M 335,88 L 345,88 L 345,112 L 335,112 Z"/>
    <g class="ink-hair">
      <line x1="335.5" y1="66" x2="344.5" y2="68.5"/>
      <line x1="335.5" y1="71" x2="344.5" y2="73.5"/>
      <line x1="335.5" y1="92" x2="344.5" y2="94.5"/>
      <line x1="335.5" y1="97" x2="344.5" y2="99.5"/>
      <line x1="335.5" y1="102" x2="344.5" y2="104.5"/>
      <line x1="335.5" y1="107" x2="344.5" y2="109.5"/>
    </g>

    <!-- Minimalist top & bottom frame bridges -->
    <path class="ink-shade" d="M 272,78 L 408,78 L 414,84 L 410,88 L 270,88 L 266,84 Z"/>
    <path class="ink-heavy" d="M 272,78 L 408,78 L 414,84 L 410,88 L 270,88 L 266,84 Z"/>
    <path class="ink-shade" d="M 270,228 L 410,228 L 414,232 L 408,238 L 272,238 L 266,232 Z"/>
    <path class="ink-heavy" d="M 270,228 L 410,228 L 414,232 L 408,238 L 272,238 L 266,232 Z"/>

    <!-- Slim beveled compression platens -->
    <path class="ink-shade-hi" d="M 294,112 L 386,112 L 392,120 L 388,123 L 292,123 L 288,120 Z"/>
    <path class="ink-heavy" d="M 294,112 L 386,112 L 392,120 L 388,123 L 292,123 L 288,120 Z"/>
    <line x1="296" y1="118" x2="384" y2="118" class="ink-hair" opacity="0.6"/>

    <path class="ink-shade-hi" d="M 292,197 L 388,197 L 392,200 L 386,208 L 294,208 L 288,200 Z"/>
    <path class="ink-heavy" d="M 292,197 L 388,197 L 392,200 L 386,208 L 294,208 L 288,200 Z"/>
    <line x1="296" y1="202" x2="384" y2="202" class="ink-hair" opacity="0.6"/>
    <path class="ink-shade" d="M 330,208 L 350,208 L 350,228 L 330,228 Z"/>
    <path class="ink-med" d="M 330,208 L 350,208 L 350,228 L 330,228 Z"/>

    <!-- Minimalist compression direction chevrons (1 crisp pair on each axis!) -->
    <path class="accent-line" d="M 310,98 L 314.5,103 L 319,98"/>
    <path class="accent-line" d="M 361,98 L 365.5,103 L 370,98"/>
    <path class="accent-line" d="M 310,220 L 314.5,215 L 319,220"/>
    <path class="accent-line" d="M 361,220 L 365.5,215 L 370,220"/>
  </g>

  <!-- ============ LAYER 2: SCULPTURAL CRUMPLED / FOLDED ARCHIVAL PAPER CORE ============ -->
  <g id="crumpled-paper">
    <path class="ink-shade" d="M 308,124 L 338,124 L 324,145 Z"/><path class="ink-shade" d="M 368,124 L 386,144 L 356,143 Z"/><path class="ink-shade" d="M 356,143 L 386,144 L 373,161 L 340,160 Z"/><path class="ink-shade" d="M 354,176 L 384,179 L 364,196 L 336,196 Z"/><path class="ink-shade" d="M 307,159 L 294,177 L 310,196 L 323,175 Z"/>
