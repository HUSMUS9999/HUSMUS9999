<svg xmlns="http://www.w3.org/2000/svg" width="492" height="270" viewBox="94 26 492 270" role="img" aria-label="VeilBreak — Universal Anti-Stealth and Browser Integrity Gate">
  <defs>
    <style>
      .ink-heavy { fill: none; stroke: #E6EDF3; stroke-width: 2.08; stroke-linecap: round; stroke-linejoin: round; }
      .ink-med   { fill: none; stroke: #E6EDF3; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
      .ink-fine  { fill: none; stroke: #9FB3C8; stroke-width: 0.9; stroke-linecap: round; stroke-linejoin: round; }
      .ink-hair  { fill: none; stroke: #6E8299; stroke-width: 0.65; stroke-linecap: round; stroke-linejoin: round; }
      .ink-fill  { fill: #E6EDF3; stroke: none; }
      .ink-mid-fill { fill: #9FB3C8; stroke: none; }
      .ink-shade { fill: #E6EDF3; fill-opacity: 0.085; stroke: none; }
      .accent-heavy { fill: none; stroke: #38BDF8; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .accent-line  { fill: none; stroke: #38BDF8; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
      .accent-fine  { fill: none; stroke: #38BDF8; stroke-width: 0.85; stroke-linecap: round; stroke-linejoin: round; }
      .accent-fill  { fill: #38BDF8; stroke: none; }
    
      @keyframes vbPulse {
        0%, 100% { opacity: 0.68; }
        50% { opacity: 1; }
      }
      @keyframes vbLineFlow {
        0% { stroke-dashoffset: 52; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes vbShardDrift {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(2.6px, -2.2px); }
      }
      @keyframes vbReticlePulse {
        0%, 100% { opacity: 0.72; }
        50% { opacity: 1; }
      }
      .accent-line, .accent-heavy { stroke-dasharray: 26 6; animation: vbLineFlow 4.0s linear infinite, vbPulse 3.2s ease-in-out infinite; }
      .accent-fine, .accent-fill { animation: vbPulse 2.8s ease-in-out infinite; }
      #mask-shards { animation: vbShardDrift 4.4s ease-in-out infinite; }
      #physics-reticle { animation: vbReticlePulse 3.4s ease-in-out infinite; }
      #prism-accents { animation: vbPulse 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .accent-line, .accent-heavy, .accent-fine, .accent-fill, #mask-shards, #physics-reticle, #prism-accents { animation: none; stroke-dasharray: none; }
      }
    
    </style>

