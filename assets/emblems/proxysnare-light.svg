<svg xmlns="http://www.w3.org/2000/svg" width="496" height="270" viewBox="92 26 496 270" role="img" aria-label="ProxySnare — HTTP Repeater and Intercepting Proxy Defense">
  <defs>
    <style>
      .ink-heavy { fill: none; stroke: #132035; stroke-width: 2.08; stroke-linecap: round; stroke-linejoin: round; }
      .ink-med   { fill: none; stroke: #132035; stroke-width: 1.38; stroke-linecap: round; stroke-linejoin: round; }
      .ink-fine  { fill: none; stroke: #334763; stroke-width: 0.9; stroke-linecap: round; stroke-linejoin: round; }
      .ink-hair  { fill: none; stroke: #64748B; stroke-width: 0.65; stroke-linecap: round; stroke-linejoin: round; }
      .ink-fill  { fill: #132035; stroke: none; }
      .ink-mid-fill { fill: #334763; stroke: none; }
      .ink-shade { fill: #132035; fill-opacity: 0.09; stroke: none; }
      .accent-heavy { fill: none; stroke: #0284C7; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; }
      .accent-line  { fill: none; stroke: #0284C7; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
      .accent-fine  { fill: none; stroke: #0284C7; stroke-width: 0.85; stroke-linecap: round; stroke-linejoin: round; }
      .accent-fill  { fill: #0284C7; stroke: none; }
    
      @keyframes psFlow {
        0% { stroke-dashoffset: 56; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes psPulse {
        0%, 100% { opacity: 0.68; }
        50% { opacity: 1; }
      }
      @keyframes psPinFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2.6px); }
      }
      @keyframes psProngClamp {
        0%, 100% { opacity: 0.88; }
        50% { opacity: 1; }
      }
      .accent-line, .accent-heavy { stroke-dasharray: 24 6; animation: psFlow 3.8s linear infinite, psPulse 3.4s ease-in-out infinite; }
      .accent-fine, .accent-fill { animation: psPulse 2.9s ease-in-out infinite; }
      #signal-ribbons .accent-line { stroke-dasharray: 18 8; animation: psFlow 2.8s linear infinite; }
      #canary-pin { animation: psPinFloat 3.6s ease-in-out infinite; }
      #snare-prongs { animation: psProngClamp 3.2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .accent-line, .accent-heavy, .accent-fine, .accent-fill, #canary-pin, #snare-prongs { animation: none; stroke-dasharray: none; }
      }
    
    </style>

