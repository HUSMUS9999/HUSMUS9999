<svg xmlns="http://www.w3.org/2000/svg" width="960" height="10" viewBox="0 0 960 10" fill="none">
  <defs>
    <linearGradient id="adiv_light_g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="adiv_light_c"><rect x="0" y="4" width="960" height="2"/></clipPath>
  </defs>
  <style>
    @keyframes aSweep {
      0% { transform: translateX(-220px); opacity: 0; }
      18%, 82% { opacity: 1; }
      100% { transform: translateX(980px); opacity: 0; }
    }
    .a-s { opacity: 0; animation: aSweep 5.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; animation-fill-mode: both; }
    @media (prefers-reduced-motion: reduce) { .a-s { animation: none; opacity: 0; } }
  </style>
  <line x1="0" y1="5" x2="960" y2="5" stroke="#D0D7DE" stroke-width="0.9"/>
  <polygon points="480,1.5 483.5,5 480,8.5 476.5,5" fill="#0284C7" opacity="0.85"/>
  <rect x="466" y="3" width="1" height="4" fill="#D0D7DE"/>
  <rect x="493" y="3" width="1" height="4" fill="#D0D7DE"/>
  <g clip-path="url(#adiv_light_c)">
    <rect x="0" y="4" width="210" height="2" fill="url(#adiv_light_g)" class="a-s"/>
  </g>
</svg>